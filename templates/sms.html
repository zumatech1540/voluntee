{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Bulk SMS Campaign</h3>

    <a href="{% url 'voter_list' %}" class="btn btn-secondary">
        ← Back to Voters
    </a>
</div>


<!-- SUCCESS MESSAGE -->
{% if success %}
<div class="alert alert-success">
    {{ success }}
</div>
{% endif %}


<!-- WARNING -->
<div class="alert alert-info">
    Send campaign messages to voters by category, ward, or polling station.
</div>


<form method="POST">
{% csrf_token %}

<div class="row">

<!-- TARGET GROUP -->
<div class="col-md-4">
<label><b>Target Group</b></label>
<select name="target" class="form-control" required>
    <option value="all">All Voters</option>
    <option value="supporters">Supporters</option>
    <option value="undecided">Undecided Voters</option>
    <option value="opponents">Opponents</option>
</select>
</div>


<!-- WARD FILTER -->
<div class="col-md-4">
<label><b>Ward Filter</b></label>
<select name="ward" class="form-control">
    <option value="">All Wards</option>
    {% for w in wards %}
    <option value="{{ w.id }}">{{ w.name }}</option>
    {% endfor %}
</select>
</div>


<!-- QUICK ACTIONS -->
<div class="col-md-4">
<label><b>Quick Messages</b></label>

<select class="form-control" onchange="insertMessage(this.value)">
    <option value="">-- Select Template --</option>
    <option value="Rally tomorrow at 10AM. Come early and bring others.">
        Rally Reminder
    </option>
    <option value="Thank you for your support. Stay strong for the campaign.">
        Appreciation Message
    </option>
    <option value="Please mobilize your neighbors for today's meeting.">
        Mobilization Message
    </option>
</select>

</div>


<!-- MESSAGE -->
<div class="col-md-12 mt-3">
<label><b>SMS Message</b></label>
<textarea name="message" id="messageBox" class="form-control" rows="6"
placeholder="Write campaign message here..." required></textarea>
</div>

</div>


<!-- BUTTON -->
<button class="btn btn-primary mt-3">
Send SMS Campaign
</button>

</form>

</div>


<!-- JS HELPERS -->
<script>
function insertMessage(text){
    if(text){
        document.getElementById("messageBox").value = text;
    }
}
</script>

{% endblock %}
