<!DOCTYPE html>
<html>
<head>
<title>Ward Strength</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

<h3>Ward Volunteer Strength</h3>

<table class="table table-bordered mt-3">

<thead>
<tr>
<th>Ward</th>
<th>Total Volunteers</th>
<th>Active</th>
</tr>
</thead>

<tbody>

{% for row in data %}
<tr>
<td>{{ row.ward }}</td>
<td>{{ row.total }}</td>
<td>{{ row.active }}</td>
</tr>
{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
