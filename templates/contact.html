{% extends 'base.html' %}

{% block content %}

<div class="container my-5">

    <h2 class="text-center mb-4">Contact Us</h2>

    <!-- SUCCESS / ERROR MESSAGES -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <form method="POST">
                    {% csrf_token %}

                    <input type="text"
                           name="name"
                           class="form-control mb-3"
                           placeholder="Your Name"
                           required>

                    <input type="email"
                           name="email"
                           class="form-control mb-3"
                           placeholder="Email"
                           required>

                    <input type="text"
                           name="subject"
                           class="form-control mb-3"
                           placeholder="Subject"
                           required>

                    <textarea name="message"
                              class="form-control mb-3"
                              rows="5"
                              placeholder="Message"
                              required></textarea>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Message
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
