{% extends 'base.html' %}
{% block content %}

<div class="container mt-5 col-md-4">

    <h3 class="text-center mb-3">Request OTP</h3>

    <!-- MESSAGES -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text"
               name="phone"
               placeholder="Enter phone"
               class="form-control mb-3"
               required>

        <button id="sendBtn" class="btn btn-primary w-100">
            Send OTP
        </button>

        <!-- TIMER -->
        <p id="timer" class="text-center text-muted mt-3">
            Ready to send OTP
        </p>

    </form>

</div>

<!-- ================= TIMER SCRIPT ================= -->
<script>
let time = 60;
let btn = document.getElementById("sendBtn");
let el = document.getElementById("timer");

// Disable button initially after click
btn.addEventListener("click", function () {

    btn.disabled = true;
    time = 60;

    let interval = setInterval(() => {

        time--;

        if (time > 0) {
            el.innerText = "Resend OTP in " + time + "s";
        } else {
            clearInterval(interval);
            btn.disabled = false;
            el.innerText = "You can resend OTP now";
        }

    }, 1000);
});
</script>

{% endblock %}
