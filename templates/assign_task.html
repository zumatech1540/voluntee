{% extends 'base.html' %}
{% block content %}

<div class="container my-5">

    <div class="card p-4 shadow-sm">

        <h3>🧑‍💼 Assign Task to Volunteer</h3>

        <!-- ================= MESSAGES ================= -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info alert-dismissible fade show mt-2">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Task Title</label>
            <input type="text" name="title" class="form-control mb-3" required>

            <label>Description</label>
            <textarea name="description" class="form-control mb-3"></textarea>

            <label>Assign To Volunteer</label>
            <select name="assigned_to" class="form-control mb-3" required>
                <option value="">-- Select Volunteer --</option>
                {% for v in volunteers %}
                    <option value="{{ v.id }}">
                        {{ v.first_name }} {{ v.last_name }}
                    </option>
                {% endfor %}
            </select>

            <label>Related Event (optional)</label>
            <select name="event" class="form-control mb-3">
                <option value="">None</option>
                {% for e in events %}
                    <option value="{{ e.id }}">{{ e.title }}</option>
                {% endfor %}
            </select>

            <label>Priority</label>
            <select name="priority" class="form-control mb-3">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <label>Due Date</label>
            <input type="date"
                   name="due_date"
                   class="form-control mb-3"
                   id="dueDate">

            <button class="btn btn-success w-100">
                Assign Task
            </button>

            <a href="{% url 'leader_dashboard' %}" class="btn btn-secondary w-100 mt-2">
                  ⬅ Back to Dashboard
            </a>
        </form>

    </div>

</div>

<!-- ================= BLOCK PAST DATES ================= -->
<script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("dueDate").setAttribute("min", today);
</script>

{% endblock %}
