<!DOCTYPE html>
<html>
<head>
    <title>Volunteer Assignment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{background:#f4f6fb;}
        .card-box{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 3px 10px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <h3>Volunteer Assignment System</h3>

    <div class="card-box mt-3">

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Ward</th>
                    <th>Polling Station</th>
                    <th>Score</th>
                    <th>Save</th>
                </tr>
            </thead>

            <tbody>

            {% for v in volunteers %}
            <tr>
            <form method="POST">
            {% csrf_token %}

                <td>
                    {{ v.first_name }} {{ v.last_name }}
                    <input type="hidden" name="user_id" value="{{ v.id }}">
                </td>

                <td>
                    <select name="volunteer_role" class="form-control">
                        <option value="">---</option>
                        <option value="mobilizer">Mobilizer</option>
                        <option value="ward_coordinator">Ward Coordinator</option>
                        <option value="polling_agent">Polling Agent</option>
                        <option value="data_collector">Data Collector</option>
                        <option value="observer">Observer</option>
                    </select>
                </td>

                <td>
                    <select name="volunteer_status" class="form-control">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="suspended">Suspended</option>
                    </select>
                </td>

                <td>
                    <select name="ward" class="form-control">
                        <option value="">---</option>
                        {% for w in wards %}
                        <option value="{{ w.id }}">{{ w.name }}</option>
                        {% endfor %}
                    </select>
                </td>

                <td>
                    <select name="polling_station" class="form-control">
                        <option value="">---</option>
                        {% for s in stations %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </td>

                <td>
                    <input type="number" name="activity_score"
                           value="{{ v.activity_score }}"
                           class="form-control">
                </td>

                <td>
                    <button class="btn btn-success btn-sm">
                        Update
                    </button>
                </td>

            </form>
            </tr>
            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
