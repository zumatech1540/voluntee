{% for task in tasks %}
<div class="col-md-4">

    <div class="card p-3 shadow-sm mb-3">

        <h5>{{ task.title }}</h5>
        <p>{{ task.description }}</p>

        <p><strong>Priority:</strong> {{ task.priority }}</p>

        <p><strong>Status:</strong>
            <span class="
                {% if task.status == 'pending' %}text-warning
                {% elif task.status == 'in_progress' %}text-primary
                {% else %}text-success{% endif %}
            ">
                {{ task.status }}
            </span>
        </p>

        <p><strong>Due:</strong> {{ task.due_date }}</p>

        <!-- ================= STATUS UPDATE ================= -->
        <form method="POST" action="{% url 'update_task_status' task.id %}">
            {% csrf_token %}

            <select name="status" class="form-control mb-2">
                <option value="pending" {% if task.status == 'pending' %}selected{% endif %}>Pending</option>
                <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                <option value="completed" {% if task.status == 'completed' %}selected{% endif %}>Completed</option>
            </select>

            <button class="btn btn-sm btn-primary w-100 mb-2">
                Update Status
            </button>
        </form>

        <!-- ================= CHAT ================= -->
       {% if task.id %}
    <a href="{% url 'task_chat' task.id %}"
       class="btn btn-dark btn-sm w-100 mt-2">
       💬 Open Chat
    </a>
{% endif %}

        

    </div>

</div>
{% endfor %}
