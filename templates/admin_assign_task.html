{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <div class="card p-4 shadow-sm">

        <h3>🧑‍💼 Assign Task to {{ user.first_name }} {{ user.last_name }}</h3>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <a href="{% url 'manage_users' %}" class="btn btn-secondary mb-3">
            ← Back
        </a>

        <form method="POST">
            {% csrf_token %}

            <label>Task Title</label>
            <input type="text" name="title" class="form-control mb-3" required>

            <label>Description</label>
            <textarea name="description" class="form-control mb-3"></textarea>

            <label>Priority</label>
            <select name="priority" class="form-control mb-3">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <label>Due Date</label>
            <input type="date" name="due_date" class="form-control mb-3" min="{{ today }}">

            <label>Related Event (optional)</label>
            <select name="event" class="form-control mb-3">
                <option value="">None</option>
                {% for e in events %}
                    <option value="{{ e.id }}">{{ e.title }}</option>
                {% endfor %}
            </select>

            <button class="btn btn-success w-100">
                Assign Task
            </button>

        </form>

    </div>

</div>

{% endblock %}
