<!DOCTYPE html>
<html>
<head>
<title>Volunteer Performance</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f5f7fb;}
.card{border-radius:12px;}
</style>

</head>

<body>

<div class="container mt-4">

<h3>Volunteer Performance Leaderboard</h3>

<div class="card p-3 mt-3">

<table class="table table-striped">

<thead>
<tr>
<th>#</th>
<th>Name</th>
<th>Role</th>
<th>Ward</th>
<th>Polling Station</th>
<th>Status</th>
<th>Score</th>
</tr>
</thead>

<tbody>

{% for v in volunteers %}
<tr>

<td>{{ forloop.counter }}</td>

<td>
{{ v.first_name }} {{ v.last_name }}
</td>

<td>{{ v.volunteer_role }}</td>

<td>{{ v.ward }}</td>

<td>{{ v.polling_station }}</td>

<td>
<span class="badge bg-success">
{{ v.volunteer_status }}
</span>
</td>

<td>
<strong>{{ v.activity_score }}</strong>
</td>

</tr>
{% endfor %}

</tbody>

</table>

</div>

</div>

</body>
</html>
